<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking Assistant</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header>
        <h1>🎬 Movie Booking Assistant</h1>
    </header>

    <!-- Movies Section -->
    <div id="movie-container"></div>

    <!-- Chat Section -->
    <div id="chat-box">

        <div class="bot-message">
            Welcome to Movie Booking Assistant! 🎥
            <br><br>
            Type "Book Tickets" to start booking.
        </div>

    </div>

    <!-- Input Area -->
    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            autocomplete="off">

        <button onclick="sendMessage()">
            Send
        </button>

        <button
            id="new-booking-btn"
            onclick="startNewBooking()"
            style="display:none;">
            New Booking
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
